<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설비관리V1(기계1파트)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 로그인 오버레이 -->
    <div id="login-overlay" class="overlay">
      <div class="login-card">
        <h2>설비관리V1 로그인</h2>
        <p class="muted">로그인 후 메뉴 및 내용을 확인할 수 있습니다.</p>
        <form id="login-form">
          <label for="login-id">아이디</label>
          <input id="login-id" type="text" required />

          <label for="login-pw">비밀번호</label>
          <input id="login-pw" type="password" required />

          <button type="submit">로그인</button>
        </form>
      </div>
    </div>

    <!-- 앱 본문 -->
    <div id="app" class="app hidden">
      <header class="header">
        <h1>설비관리V1(기계1파트)</h1>
        <button id="logout-btn" class="ghost-btn">로그아웃</button>
      </header>

      <!-- GNB -->
      <nav class="gnb">
        <button class="gnb-btn active" data-main="home">HOME</button>
        <button class="gnb-btn" data-main="lubrication">급유급지관리</button>
      </nav>

      <!-- LNB -->
      <nav id="lnb" class="lnb hidden">
        <button class="lnb-btn active" data-sub="예비소성로">예비소성로</button>
        <button class="lnb-btn" data-sub="본소성">본소성</button>
        <button class="lnb-btn" data-sub="열처리">열처리</button>
        <button class="lnb-btn" data-sub="혼합설비">혼합설비</button>
        <button class="lnb-btn" data-sub="필터프레스">필터프레스</button>
        <button class="lnb-btn" data-sub="진공건조기">진공건조기</button>
        <button class="lnb-btn" data-sub="냉각기">냉각기</button>
        <button class="lnb-btn" data-sub="관리메뉴">관리메뉴</button>
      </nav>

      <main>
        <section id="home-section"></section>
        <section id="process-section" class="hidden"></section>
        <section id="management-section" class="hidden"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
